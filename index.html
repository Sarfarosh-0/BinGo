<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F8F4" />
    <meta name="description" content="BinGo — Smart Waste Sorting for SDG 15 (Life on Land). Sort your waste in one scan." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BinGo — Smart Waste Sorting</title>

    <!-- Google Fonts for handwritten slogan -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />

    <!--
      TensorFlow.js must be a regular (non-defer) script so that window.tf is
      guaranteed to be defined before any ES module code runs.
      ES modules (type="module") are always deferred; regular scripts run first
      in document order, so this CDN tag executes before /src/main.jsx.
      Pinned to a stable patch version to prevent surprise regressions.
    -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  </head>
  <body class="bg-[#F3F8F4] text-[#0E2A1F] antialiased select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
