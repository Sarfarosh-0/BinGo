<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F8F4" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:description" content="BinGo — Smart Waste Sorting for SDG 15 (Life on Land). Sort your waste in one scan." />
    <title>BinGo — Smart Waste Sorting</title>

    <!--
      TensorFlow.js is self-hosted (vendored from the pinned npm package by
      `npm run vendor:tf`) rather than pulled from a CDN. It must be a regular
      (non-defer) script so that window.tf is guaranteed to be defined before
      any ES module code runs: ES modules (type="module") are always deferred,
      and regular scripts run first in document order, so this executes before
      /src/main.jsx. Same-origin means no third-party supply-chain dependency
      and a strict Content-Security-Policy with no external script-src.
    -->
    <script src="/vendor/tf.min.js"></script>
  </head>
  <body class="bg-[#F3F8F4] text-[#0E2A1F] antialiased select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
